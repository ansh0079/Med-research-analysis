name: Import Curated Topic MCQs

# Manual only. Loads data/curated-topic-mcqs/*.json into production teaching_objects.
# Always run mode=dry-run first; mode=apply writes (idempotent upsert by object_key).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run or apply'
        required: true
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'apply']

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: medsearch-production-deploy
      cancel-in-progress: false
    steps:
      - name: Run curated MCQ importer via SSH
        uses: appleboy/ssh-action@v1
        env:
          MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.HETZNER_HOST || '178.105.155.246' }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 8m
          envs: MODE
          script: |
            set -e
            cd /opt/medsearch
            echo "Deployed commit: $(git rev-parse --short HEAD)"
            case "$MODE" in
              dry-run) FLAG=--dry-run ;;
              apply) FLAG=--apply ;;
              *) echo "bad mode $MODE"; exit 1 ;;
            esac
            # /app/data in the container is a persistent volume that hides the batches baked into the
            # image (the importer then reports "No curated MCQ batches found"), so mount them from this
            # checkout instead.
            docker compose -f docker-compose.hetzner.yml run --rm --no-deps -T -e USE_POSTGRES_MAIN=true \
              -v /opt/medsearch/data/curated-topic-mcqs:/curated:ro web \
              node server/scripts/importCuratedTopicMcqs.js --dir /curated "$FLAG"
