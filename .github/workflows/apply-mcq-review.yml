name: Apply MCQ Review Edits

# Manual only. Applies reviewer-approved withdrawals and corrections to stored MCQs.
# Always run mode=dry-run first; mode=apply writes (idempotent).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run or apply'
        required: true
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'apply']
      data_filename:
        description: 'Filename under /opt/medsearch/data/mcq-review (e.g. review-2026-10-04.json)'
        required: true
        default: 'review-2026-10-04.json'
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: medsearch-production-deploy
      cancel-in-progress: false
    steps:
      - name: Run MCQ review applier via SSH
        uses: appleboy/ssh-action@v1
        env:
          MODE: ${{ inputs.mode }}
          DATA: ${{ inputs.data_filename }}
        with:
          host: ${{ secrets.HETZNER_HOST || '178.105.155.246' }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          envs: MODE,DATA
          script: |
            set -euo pipefail
            cd /opt/medsearch
            echo "Deployed commit: $(git rev-parse --short HEAD)"
            case "$MODE" in
              dry-run) FLAG=--dry-run ;;
              apply) FLAG=--apply ;;
              *) echo "bad mode $MODE"; exit 1 ;;
            esac
            FILE="/review/${DATA}"
            if [ ! -f "$FILE" ]; then
              echo "Data file not found: $FILE"
              exit 2
            fi
            docker compose -f docker-compose.hetzner.yml run --rm --no-deps -T -e USE_POSTGRES_MAIN=true \
              -v /opt/medsearch/data/mcq-review:/review:ro web \
              node server/scripts/applyMcqReviewEdits.js --data "$FILE" "$FLAG"
