name: Apply MCQ Review Edits

# Manual only. Applies reviewer-approved withdrawals and corrections to stored MCQs.
# Always run mode=dry-run first; mode=apply writes (idempotent).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run or apply'
        required: true
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'apply']
      data_filename:
        description: 'Filename under /opt/medsearch/data/mcq-review (e.g. review-2026-10-04.json)'
        required: true
        default: 'review-2026-10-04.json'
        type: string
      source_data_filename:
        description: 'Optional companion evidence file under /opt/medsearch/data/mcq-review'
        required: false
        default: ''
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: medsearch-production-deploy
      cancel-in-progress: false
    steps:
      - name: Run MCQ review applier via SSH
        uses: appleboy/ssh-action@v1
        env:
          MODE: ${{ inputs.mode }}
          DATA: ${{ inputs.data_filename }}
          SOURCE_DATA: ${{ inputs.source_data_filename }}
        with:
          host: ${{ secrets.HETZNER_HOST || '178.105.155.246' }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          envs: MODE,DATA,SOURCE_DATA
          script: |
            set -euo pipefail
            cd /opt/medsearch
            echo "Deployed commit: $(git rev-parse --short HEAD)"
            case "$MODE" in
              dry-run) FLAG=--dry-run ;;
              apply) FLAG=--apply ;;
              *) echo "bad mode $MODE"; exit 1 ;;
            esac
            HOST_FILE="/opt/medsearch/data/mcq-review/${DATA}"
            FILE="/review/${DATA}"
            if [ ! -f "$HOST_FILE" ]; then
              echo "Data file not found: $HOST_FILE"
              exit 2
            fi
            if [ "$MODE" = "apply" ] && [ -n "$SOURCE_DATA" ]; then
              SOURCE_HOST_FILE="/opt/medsearch/data/mcq-review/${SOURCE_DATA}"
              SOURCE_FILE="/review/${SOURCE_DATA}"
              if [ ! -f "$SOURCE_HOST_FILE" ]; then
                echo "Source data file not found: $SOURCE_HOST_FILE"
                exit 2
              fi
              docker compose -f docker-compose.hetzner.yml run --rm --no-deps -T -e USE_POSTGRES_MAIN=true \
                -v /opt/medsearch/data/mcq-review:/review:ro web \
                node server/scripts/importQuestionRepairSources.js "$SOURCE_FILE"
            fi
            docker compose -f docker-compose.hetzner.yml run --rm --no-deps -T -e USE_POSTGRES_MAIN=true \
              -v /opt/medsearch/data/mcq-review:/review:ro web \
              node server/scripts/applyMcqReviewEdits.js --data "$FILE" "$FLAG"
            if [ "$MODE" = "apply" ]; then
              docker exec medsearch-pg psql -U medsearch -d medsearch -v ON_ERROR_STOP=1 -c \
                "SELECT status, COUNT(*) FROM question_work_queue WHERE cohort='topic_repair' GROUP BY status ORDER BY status;"
              docker exec medsearch-pg psql -U medsearch -d medsearch -v ON_ERROR_STOP=1 -c \
                "SELECT human_decision, COUNT(*) FROM question_audit WHERE reviewed_by='workflow:apply-mcq-review' GROUP BY human_decision ORDER BY human_decision;"
            fi
