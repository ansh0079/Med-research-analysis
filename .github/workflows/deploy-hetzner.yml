name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: medsearch-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          # Prefer repository/org secret HETZNER_HOST. Fallback keeps deploy working
          # until the secret is configured; remove the literal once secret is set.
          host: ${{ secrets.HETZNER_HOST || '178.105.155.246' }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            cd /opt/medsearch
            git fetch origin main
            git reset --hard origin/main
            bash deploy/hetzner/deploy.sh
