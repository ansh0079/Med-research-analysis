name: Postgres Migrations

# Production runs PostgreSQL; the local suite and every other gate run SQLite.
# This workflow is the only place migration files are executed against a real
# Postgres server before they reach production (see PENDING-AND-BUGS-2026-09-20.md
# item "Migrations 098, 100 and 101 are untested on Postgres").

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'scripts/verify-pg-migrations.js'
      - '.github/workflows/pg-migrations.yml'

permissions:
  contents: read

jobs:
  pg-migrations:
    name: Full migration chain on real PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signalmd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalmd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply full migration chain and verify 098/100/101 artifacts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signalmd_test
        run: node scripts/verify-pg-migrations.js
