name: Full production question audit

on:
    workflow_dispatch:
        inputs:
            action:
                description: Audit action
                required: true
                type: choice
                options: [status, sync, stage1, stage2, verify-passes, hold-errors, finalize, export]
                default: status
            budget_usd:
                description: Maximum incremental LLM spend for this run
                required: true
                default: '10'
            limit:
                description: Maximum questions reviewed in this run
                required: true
                default: '100000'

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 360
        steps:
            - uses: actions/checkout@v4
            - name: Configure production SSH
              env:
                  SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
              run: |
                  RUNNER_ACTION="$ACTION"
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
                  sed -i 's/\r$//' ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -H 178.105.155.246 >> ~/.ssh/known_hosts
            - name: Run bounded production audit
              env:
                  ACTION: ${{ inputs.action }}
                  BUDGET_USD: ${{ inputs.budget_usd }}
                  LIMIT: ${{ inputs.limit }}
              run: |
                  RUNNER_ACTION="$ACTION"
                  if [ "$ACTION" = "hold-errors" ]; then
                    ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@178.105.155.246 "docker exec medsearch-pg psql -U medsearch -d medsearch -v ON_ERROR_STOP=1 -c \"UPDATE question_audit SET pre_flag_reason='automated_review_unreadable_or_truncated', status='needs_human', updated_at=NOW()::text WHERE human_decision IS NULL AND pre_flag_reason IS NULL AND stage1_verdict IS NULL;\""
                  fi
                  if [ "$ACTION" = "finalize" ]; then
                    ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@178.105.155.246 "docker exec medsearch-pg psql -U medsearch -d medsearch -v ON_ERROR_STOP=1 -c \"UPDATE question_audit SET status = CASE WHEN human_decision IS NOT NULL THEN 'human_' || human_decision WHEN pre_flag_reason IS NOT NULL THEN 'needs_human' WHEN stage2_verdict = 'pass' THEN 'cleared_by_second_review' WHEN stage2_verdict = 'flag' THEN 'needs_human' WHEN stage1_verdict = 'pass' THEN 'passed' ELSE 'needs_human' END, pre_flag_reason = CASE WHEN human_decision IS NULL AND stage1_verdict = 'flag' AND stage2_verdict IS NULL THEN COALESCE(pre_flag_reason, 'secondary_review_unreadable_or_truncated') WHEN human_decision IS NULL AND stage1_verdict IS NULL THEN COALESCE(pre_flag_reason, 'automated_review_unreadable_or_truncated') ELSE pre_flag_reason END, updated_at=NOW()::text;\""
                  fi
                  if [ "$ACTION" = "export" ]; then
                    scp server/scripts/exportFullQuestionAudit.sql root@178.105.155.246:/tmp/export-full-question-audit.sql
                    ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@178.105.155.246 "docker exec -i medsearch-pg psql -U medsearch -d medsearch -v ON_ERROR_STOP=1 < /tmp/export-full-question-audit.sql > /tmp/signal-md-full-question-audit.csv"
                    RUNNER_ACTION="status"
                  fi
                  scp server/scripts/runFullQuestionAudit.js root@178.105.155.246:/tmp/runFullQuestionAudit.js
                  scp server/services/questionAudit/questionAuditService.js root@178.105.155.246:/tmp/questionAuditService.js
                  ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@178.105.155.246 "cd /opt/medsearch && docker compose -f docker-compose.hetzner.yml run --rm --no-deps -T -u 0 \
                    -e USE_POSTGRES_MAIN=true \
                    -e QUESTION_AUDIT_STAGE1_PROVIDER=gemini \
                    -e QUESTION_AUDIT_STAGE1_MODEL=gemini-2.5-flash-lite \
                    -e QUESTION_AUDIT_STAGE2_PROVIDER=gemini \
                    -e QUESTION_AUDIT_STAGE2_MODEL=gemini-2.5-flash \
                    -e QUESTION_AUDIT_MAX_OUTPUT_TOKENS=2400 \
                    -v /tmp:/audit \
                    -v /tmp/runFullQuestionAudit.js:/app/server/scripts/runFullQuestionAudit.js:ro \
                    -v /tmp/questionAuditService.js:/app/server/services/questionAudit/questionAuditService.js:ro \
                    web node server/scripts/runFullQuestionAudit.js \
                    --action '$RUNNER_ACTION' --budget-usd '$BUDGET_USD' --limit '$LIMIT' --concurrency 3 \
                    --report /audit/signal-md-full-question-audit.json --csv /audit/signal-md-full-question-audit.csv"
                  scp root@178.105.155.246:/tmp/signal-md-full-question-audit.json ./signal-md-full-question-audit.json
                  if [ "$ACTION" = "export" ]; then
                    scp root@178.105.155.246:/tmp/signal-md-full-question-audit.csv ./signal-md-full-question-audit.csv
                  fi
            - uses: actions/upload-artifact@v4
              with:
                  name: signal-md-full-question-audit-${{ inputs.action }}
                  path: |
                      signal-md-full-question-audit.json
                      signal-md-full-question-audit.csv
                  retention-days: 30
